<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Fix — My Profile</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<style>
  .profile-card{ margin:8px 18px 18px; text-align:center; overflow:hidden; padding:0; }
  .cover{ height:90px; background:linear-gradient(135deg, var(--teal-deep), #142433); }
  .avatar-wrap{
    width:88px; height:88px; border-radius:50%; background:var(--card); margin:-44px auto 0;
    padding:4px; box-shadow:0 6px 18px rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center;
  }
  .avatar-lg{
    width:100%; height:100%; border-radius:50%; background:var(--teal); color:#06201d;
    display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800;
  }
  .user-name{ font-size:20px; font-weight:800; margin:12px 0 2px; }
  .user-email{ font-size:12.5px; color:var(--muted); margin-bottom:18px; }

  .stats{ display:flex; border-top:1px solid var(--line); }
  .stat-item{ flex:1; padding:16px 6px; border-right:1px solid var(--line); }
  .stat-item:last-child{ border-right:none; }
  .stat-item b{ display:block; font-size:17px; font-variant-numeric:tabular-nums; }
  .stat-item span{ font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }

  .section{ padding:18px; padding-top:4px; }
  .section-label{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:0 0 10px; }

  .order-card{ display:flex; gap:14px; align-items:flex-start; }
  .order-artisan{ display:flex; flex-direction:column; align-items:center; min-width:66px; text-align:center; }
  .order-artisan .avatar{ width:46px; height:46px; font-size:15px; margin-bottom:6px; }
  .order-name{ font-size:11.5px; font-weight:700; line-height:1.2; }
  .order-role{ font-size:9.5px; color:var(--muted); margin-top:2px; }
  .order-detail{ flex:1; }
  .order-desc{ font-size:12.5px; color:var(--ink); line-height:1.5; margin:8px 0 0; }

  .logout-btn{
    width:100%; padding:13px; border-radius:12px; border:1px solid rgba(255,107,107,0.3);
    background:rgba(255,107,107,0.1); color:var(--danger); font-weight:700; font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="brand-mark">✓</div>
      <div class="brand-name">Pro Fix</div>
    </header>

    <div class="profile-card card">
      <div class="cover"></div>
      <div class="avatar-wrap"><div class="avatar-lg" id="userInitials">PN</div></div>
      <div class="user-name" id="userName">Preneil Naidoo</div>
      <div class="user-email">preneil.naidoo@email.com</div>
      <div class="stats">
        <div class="stat-item"><b>12</b><span>Bookings</span></div>
        <div class="stat-item"><b>1</b><span>Active</span></div>
        <div class="stat-item"><b>R4,250</b><span>Spent</span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Order Tracking</div>
      <div class="order-card card">
        <div class="order-artisan">
          <div class="avatar" style="background:#F2B705;" id="artisanInitials">JM</div>
          <div class="order-name" id="artisanName">Jonny Mand</div>
          <div class="order-role">Electrician</div>
        </div>
        <div class="order-detail">
          <span class="status-pill on">In progress</span>
          <p class="order-desc">Rewiring the kitchen circuit and installing a new distribution board. Arrived on site at 10:30, estimated completion by 14:00.</p>
        </div>
      </div>
    </div>

    <div class="section" style="padding-top:0;">
      <button class="logout-btn" onclick="handleLogout()">Log out</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <nav class="tabbar">
    <button class="tab" data-tab="feed" data-placeholder>🏠<span>Feed</span><span class="tab-dot"></span></button>
    <button class="tab" data-tab="track" data-placeholder>📍<span>Track</span><span class="tab-dot"></span></button>
    <button class="tab" data-tab="bookings" data-placeholder>🗂️<span>Bookings</span><span class="tab-dot"></span></button>
    <button class="tab" data-tab="profile">👤<span>Profile</span><span class="tab-dot"></span></button>
  </nav>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
  function handleLogout(){
    if(confirm('Are you sure you want to log out?')){
      window.location.href = "{{ url_for('sign_up') }}";
    }
  }

  window.onload = function(){
    const name = document.getElementById('userName').innerText;
    document.getElementById('userInitials').innerText = initials(name);

    const artisanName = document.getElementById('artisanName').innerText;
    document.getElementById('artisanInitials').innerText = initials(artisanName);
  };

  wireTabBar('profile');
</script>
</body>
</html>
