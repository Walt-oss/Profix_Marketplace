<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Fix — Find a Pro</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<style>
  .search-row{ padding:10px 18px 10px; }

  .grid{ padding:0 18px; display:flex; flex-direction:column; gap:12px; }

  .worker-card{ opacity:0; transform:translateY(10px); animation:rise .4s cubic-bezier(.2,.8,.2,1) forwards; }

  .card-head{ display:flex; align-items:center; gap:12px; padding-right:34px; }
  .card-head .avatar{ width:46px; height:46px; font-size:16px; }
  .name{ font-weight:700; font-size:15px; color:var(--ink); }
  .role{ font-size:12px; color:var(--muted); margin-top:1px; }

  .card-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .stars{ color:var(--gold); font-size:13px; }
  .jobs{ font-size:11px; color:var(--muted); margin-left:6px; }
  .rate{ font-family:Consolas,'Courier New',monospace; font-weight:700; font-size:14px; color:var(--ink); }
  .rate small{ color:var(--muted); font-weight:400; }

  .expand-btn{ width:100%; margin-top:12px; }
  .details{ max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.2,.8,.2,1); }
  .details.open{ max-height:180px; margin-top:12px; }
  .details-inner{ border-top:1px solid var(--line); padding-top:12px; font-size:12.5px; line-height:1.5; color:var(--ink); }
  .details-inner b{ color:var(--muted); font-weight:600; }
  .book-btn{ width:100%; margin-top:12px; padding:12px; border:none; border-radius:10px; background:var(--teal); color:#06201d; font-weight:800; font-size:13px; cursor:pointer; }

  .skel{ height:98px; padding:16px; }
  .skel-row{ display:flex; gap:12px; align-items:center; }
  .skel-circle{ width:46px; height:46px; border-radius:50%; }
  .skel-line{ height:10px; border-radius:4px; margin-bottom:6px; }
</style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="brand-mark">✓</div>
      <div>
        <div class="brand-name">Pro Fix</div>
        <div class="brand-sub">Verified trade network — Gqeberha</div>
      </div>
    </header>

    <div class="search-row"><input id="searchInput" class="text-input" placeholder="Search by name or trade"></div>
    <nav class="chip-row" id="chipRow"></nav>
    <main class="grid" id="grid"></main>
  </div>

  <div class="toast" id="toast"></div>

  <nav class="tabbar">
    <button class="tab" data-tab="feed">🏠<span>Feed</span><span class="tab-dot"></span></button>
    <a class="tab" data-tab="profile" href="{{ url_for('profile') }}">👤<span>Profile</span><span class="tab-dot"></span></a>
  </nav>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>

  const catColor = { electrician:'#F2B705', plumber:'#3DA9FC', repair:'#E2703A', ict:'#9B8CFF' };
  const categories = [
    {id:'all',label:'All'},{id:'electrician',label:'Electricians'},{id:'plumber',label:'Plumbers'},
    {id:'repair',label:'Repairs'},{id:'ict',label:'ICT Support'},
  ];

  let activeCategory='all', searchTerm='', openCard=null;

  function renderChips(){
    const row=document.getElementById('chipRow'); row.innerHTML='';
    categories.forEach(c=>{
      const chip=document.createElement('button');
      chip.className='chip'+(c.id===activeCategory?' active':'');
      chip.textContent=c.label;
      chip.onclick=()=>{ activeCategory=c.id; renderChips(); renderGrid(); };
      row.appendChild(chip);
    });
  }

  function matches(w){
    return (activeCategory==='all'||w.category===activeCategory) && w.name.toLowerCase().includes(searchTerm.toLowerCase());
  }

  function renderGrid(){
    const grid=document.getElementById('grid');
    const list=workers.filter(matches);
    grid.innerHTML='';
    if(list.length===0){ grid.innerHTML='<div class="empty">No pros match that search.<br>Try a different trade.</div>'; return; }
    list.forEach((w,i)=>{
      const card=document.createElement('div');
      card.className='card worker-card';
      card.style.animationDelay=(i*45)+'ms';
      card.innerHTML=`
        <div class="hex ${w.verified?'':'dim'}" data-id="${w.id}" title="Verification">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="${w.verified?'#06201d':'#8994A6'}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="card-head">
          <div class="avatar" style="background:${catColor[w.category]}">${initials(w.name)}</div>
          <div>
            <div class="name">${w.name}</div>
            <div class="role">${w.label} · ${w.area}</div>
          </div>
        </div>
        <div class="card-foot">
          <div><span class="stars">${'★'.repeat(w.rating)}${'☆'.repeat(5-w.rating)}</span><span class="jobs">${w.jobs} jobs</span></div>
          <div class="rate">R${w.rate}<small>/hr</small></div>
        </div>
        <button class="btn-ghost expand-btn" data-id="${w.id}">View details</button>
        <div class="details" id="details-${w.id}">
          <div class="details-inner">
            <div><b>Certifications:</b> ${w.certs}</div>
            <button class="book-btn" data-name="${w.name}">Book ${w.name.split(' ')[0]}</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    grid.querySelectorAll('.expand-btn').forEach(btn=>{
      btn.onclick=()=>toggleDetails(btn.dataset.id);
    });
    grid.querySelectorAll('.hex').forEach(hex=>{
      hex.onclick=()=>{
        const w = workers.find(x=>x.id==hex.dataset.id);
        showToast(w.verified ? `✓ ${w.name} — ID checked, insured, background cleared` : `${w.name} hasn't completed verification yet`);
      };
    });
    grid.querySelectorAll('.book-btn').forEach(btn=>{
      btn.onclick=()=>{
        window.location.href = "{{ url_for('chat_window') }}";
      };
    });
  }

  function toggleDetails(id){
    const el=document.getElementById('details-'+id);
    if(openCard && openCard!==id){
      const prev=document.getElementById('details-'+openCard);
      if(prev) prev.classList.remove('open');
    }
    el.classList.toggle('open');
    openCard = el.classList.contains('open') ? id : null;
  }

  document.getElementById('searchInput').addEventListener('input', e=>{ searchTerm=e.target.value; renderGrid(); });

  function showSkeleton(){
    const grid=document.getElementById('grid'); grid.innerHTML='';
    for(let i=0;i<4;i++){
      const s=document.createElement('div');
      s.className='card skel';
      s.innerHTML=`<div class="skel-row"><div class="skel-circle skel-shimmer"></div><div style="flex:1"><div class="skel-line skel-shimmer" style="width:50%"></div><div class="skel-line skel-shimmer" style="width:35%"></div></div></div>`;
      grid.appendChild(s);
    }
  }

  wireTabBar('feed');
  renderChips();
  showSkeleton();
  setTimeout(renderGrid, 600);
</script>
</body>
</html>
