<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Fix - Client Profile</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #04AA6D;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg);
        }

        /* Navigation Styles */
        .top-nav {
            background-color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0; 
            z-index: 100;
        }
        .m-icon { font-size: 30px; cursor: pointer; margin-right: 20px; }

        /* Side Drawer */
        .side-drawer {
            height: 100%; width: 0; position: fixed; z-index: 1000;
            top: 0; left: 0; background-color: var(--primary);
            overflow-x: hidden; transition: 0.5s; padding-top: 60px;
        }
        .side-drawer a {
            padding: 15px 32px; text-decoration: none; font-size: 18px;
            color: #ecf0f1; border-bottom: 1px solid #3e4f5f; display: block;
        }
        .side-drawer .close-btn { position: absolute; top: 10px; right: 25px; font-size: 36px; color: white; cursor: pointer; }

        .olay {
            display: none; position: fixed; width: 100%; height: 100%;
            top: 0; left: 0; background-color: rgba(0,0,0,0.5); z-index: 500;
        }

        /* Profile Card Styling */
        .card-container {
            width: 350px;
            height: 480px;
            background: #FFF;
            border-radius: 15px;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
        }

        .upper-container { 
            height: 150px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
        }

        /* Initials Avatar Styling */
        .image-container {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            margin: -50px auto 0 auto;
            padding: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .initials-avatar {
            width: 100%;
            height: 100%;
            background-color: var(--accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .lower-container {
            padding: 20px;
            color: var(--primary);
        }

        .user-name {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }

        .user-email {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 20px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .stat-item b { display: block; font-size: 18px; }
        .stat-item span { font-size: 11px; color: #7f8c8d; text-transform: uppercase; }

        .logout-btn {
            margin-top: 30px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover { background: #c0392b; transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="top-nav">
        <span class="m-icon" onclick="openNav()">&#9776;</span>
        <div style="font-weight: bold; font-size: 20px;">PRO FIX</div>
    </div>

    <div id="myDrawer" class="side-drawer">
        <span class="close-btn" onclick="closeNav()">&times;</span>
    <a href="file:///C:/Users/Preneil%20Naidoo/Documents/prototype/Workend.html">Home</a>
    <a href="file:///C:/Users/Preneil%20Naidoo/Documents/prototype/Workend5.html">Track</a>
    <a href="file:///C:/Users/Preneil%20Naidoo/Documents/prototype/Workend7.html">Profile</a>
    <a href="file:///C:/Users/Preneil%20Naidoo/Documents/prototype/Workend3.html">Receipt</a>
    <a href="file:///C:/Users/Preneil%20Naidoo/Documents/prototype/Workend6.html">About Us</a>
    </div>

    <div id="mOverlay" class="olay" onclick="closeNav()"></div>

    <div class="card-container">
        <div class="upper-container"></div>
        
        <div class="image-container">
            <div class="initials-avatar" id="userInitials">PN</div>
        </div>

        <div class="lower-container">
            <div class="user-name" id="userName">Preneil Naidoo</div>
            <div class="user-email">preneil.naidoo@email.com</div>

            <div class="stats">
                <div class="stat-item">
                    <b>12</b>
                    <span>Total Bookings</span>
                </div>
                <div class="stat-item">
                    <b>1</b>
                    <span>Active Now</span>
                </div>
                <div class="stat-item">
                    <b>R4,250</b>
                    <span>Total Spent</span>
                </div>
            </div>

            <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        </div>
    </div>

    <script>
        function openNav() {
            document.getElementById("myDrawer").style.width = "250px";
            document.getElementById("mOverlay").style.display = "block";
        }

        function closeNav() {
            document.getElementById("myDrawer").style.width = "0";
            document.getElementById("mOverlay").style.display = "none";
        }

        function handleLogout() {
            if(confirm("Are you sure you want to log out?")) {
                window.location.href = "Workend.html"; 
            }
        }

        
        window.onload = function() {
            const name = document.getElementById('userName').innerText;
            const initials = name.split(' ').map(n => n[0]).join('');
            document.getElementById('userInitials').innerText = initials;
        };
    </script>
</body>
</html>
