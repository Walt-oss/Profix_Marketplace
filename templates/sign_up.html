<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Fix — Sign Up</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<style>
  body{ display:flex; justify-content:center; padding:36px 0; }
  .phone{ padding-bottom:36px; }
  .topbar{ flex-direction:column; align-items:center; text-align:center; padding:0 18px 22px; }
  .brand-mark{ margin-bottom:10px; }

  .segmented{ margin:0 18px 20px; }

  .form-card{ margin:0 18px; display:none; }
  .form-card.show{ display:block; }

  .btn-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; }
  .btn-row .btn-primary{ flex:1; }
</style>
</head>
<body>

  <div class="phone">
    <header class="topbar">
      <div class="brand-mark">✓</div>
      <div class="brand-name">Pro Fix</div>
      <div class="brand-sub">Create your account</div>
    </header>

    <nav class="segmented">
      <button type="button" class="active" onclick="showForm('client', this)">Client</button>
      <button type="button" onclick="showForm('worker', this)">Worker</button>
    </nav>

    <div id="clientForm" class="form-card card show">
      <form action="/sign_up" method="post">
        <div class="field-group">
          <label class="field-label">Name</label>
          <input class="text-input" type="text" name="Name" placeholder="Enter name" required>
        </div>
        <div class="field-group">
          <label class="field-label">Surname</label>
          <input class="text-input" type="text" name="Surname" placeholder="Enter surname" required>
        </div>
        <div class="field-group">
          <label class="field-label">Email</label>
          <input class="text-input" type="email" name="Email" placeholder="Enter email" required>
        </div>
        <div class="field-group">
          <label class="field-label">Password</label>
          <input class="text-input" type="password" name="Password" placeholder="Enter password" required>
        </div>
        <div class="btn-row">
          <input type="submit" class="btn-primary" value="Sign up as client">
        </div>
        <div style="text-align:center; margin-top:12px;">
          <input type="reset" class="btn-text" value="Clear form">
        </div>
      </form>
    </div>

    <div id="workerForm" class="form-card card">
      <form action="/send_freelancer_data" method="post">
        <div class="field-group">
          <label class="field-label">Name</label>
          <input class="text-input" type="text" name="Name" placeholder="Enter name" required>
        </div>
        <div class="field-group">
          <label class="field-label">Profession</label>
          <input class="text-input" type="text" name="Profession" placeholder="e.g. Plumber, Electrician" required>
        </div>
        <div class="field-group">
          <label class="field-label">Email</label>
          <input class="text-input" type="email" name="Email" placeholder="Enter email" required>
        </div>
        <div class="field-group">
          <label class="field-label">Password</label>
          <input class="text-input" type="password" name="Password" placeholder="Enter password" required>
        </div>
        <div class="field-group">
          <label class="field-label">Qualification</label>
          <input class="text-input" type="text" name="Qualification" placeholder="Enter qualification or certificate">
        </div>
        <div class="btn-row">
          <input type="submit" class="btn-primary" value="Sign up as worker">
        </div>
        <div style="text-align:center; margin-top:12px;">
          <input type="reset" class="btn-text" value="Clear form">
        </div>
      </form>
    </div>
  </div>

<script>
  function showForm(type, btn){
    document.getElementById('clientForm').classList.remove('show');
    document.getElementById('workerForm').classList.remove('show');
    document.querySelectorAll('.segmented button').forEach(b => b.classList.remove('active'));

    document.getElementById(type === 'client' ? 'clientForm' : 'workerForm').classList.add('show');
    btn.classList.add('active');
  }
</script>
</body>
</html>
